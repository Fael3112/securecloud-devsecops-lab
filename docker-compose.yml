services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: labdb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d labdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
    ports:
      - "8000:8000"
    environment:
      ENV: dev
      DATABASE_URL: postgresql://lab:lab@db:5432/labdb
    depends_on:
      db:
        condition: service_healthy
